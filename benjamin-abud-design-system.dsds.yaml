    kind: component
    name: Button
    description: C01 Button.
    purpose: "C01 Button. Label, Variant, Size y State conservados. Show leading icon / Show trailing icon: false por defecto. Leading icon / Trailing icon: instance swap independientes dentro del auto layout, antes/después de Label. El glifo predeterminado hereda los colores semánticos del texto; iconos alternativos conservan su contrato cromático. Ampliación solicitada para S01 Header el 2026-10-26; sin nuevas variantes ni tokens."
