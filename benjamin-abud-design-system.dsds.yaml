  - id: card
    kind: component
    name: Card
    description: "C03: tarjeta con imagen de fondo, título y descripción."
    purpose: "C03: tarjeta con imagen de fondo, título y descripción. Fuente: capturas del usuario y Framer Home/Case Notion. Framer tiene placeholders sin imagen, título y descripción ocultos; aquí visibles por pedido. Hover/Pressed propuestos (borde, sin escala). La apertura de caso corresponde a C04: override withExpandingCaseSheet, entrada 0.8 s cubic-bezier(0.87,0,0.13,1); sin desplazamiento con reduced motion. No se implementa el panel C04 en esta familia. Interactive: botón si abre panel, enlace si navega; sin acciones anidadas. Focus documenta focus-visible; Figma no certifica tabulación DOM. Actualización: hover con imagen al 105%, tres adelantos sobre el borde superior y Smart Animate 300 ms ease-out. La geometría del contenedor y sus textos no cambia."
    metadata:
      status:
        status: design-only
      level: molecule
    refs:
      - href: "https://www.figma.com/design/FvaEDyROUUsM8ntHj8C9f8/?node-id=299-77"
